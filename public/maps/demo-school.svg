<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" rx="16" fill="#FAFAF9"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7E5E4" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Building outline -->
  <rect x="200" y="100" width="800" height="560" rx="8" fill="white" stroke="#D6D3D1" stroke-width="2"/>

  <!-- Roof / Top section (Classrooms) -->
  <rect x="300" y="120" width="600" height="140" rx="4" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="600" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#A8A29E" font-weight="500">CLASSROOMS</text>

  <!-- Left wing (Cafeteria) -->
  <rect x="220" y="290" width="280" height="200" rx="4" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="360" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#A8A29E" font-weight="500">CAFETERIA</text>

  <!-- Right wing (Gymnasium) -->
  <rect x="700" y="290" width="280" height="200" rx="4" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="840" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#A8A29E" font-weight="500">GYMNASIUM</text>

  <!-- Central corridor -->
  <rect x="520" y="280" width="160" height="250" rx="4" fill="#EDEBE9" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="600" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#A8A29E" font-weight="500">CORRIDOR</text>

  <!-- Entrance -->
  <rect x="500" y="580" width="200" height="80" rx="4" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="600" y="625" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#A8A29E" font-weight="500">ENTRANCE</text>

  <!-- Entrance arrow -->
  <path d="M600 680 L600 720 M585 705 L600 720 L615 705" stroke="#A8A29E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative text -->
  <text x="600" y="760" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#D6D3D1" letter-spacing="4">FLOOR PLAN</text>
</svg>
